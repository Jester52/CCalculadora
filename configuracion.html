<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configuración - Cronos</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #001f3f 0%, #004a77 50%, #0074d9 100%);
            background-attachment: fixed;
            font-family: 'Roboto', sans-serif; color: white;
        }
        h1 { font-size: 28px; font-weight: 300; letter-spacing: 4px; margin-bottom: 30px; text-transform: uppercase; }
        .preset-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 100%; max-width: 380px;
            padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .preset-info b { font-size: 18px; display: block; font-weight: 400; }
        .preset-info span { color: #c2e7ff; font-size: 14px; }
        .btn-launch {
            background: #c2e7ff; color: #003355; border: none;
            padding: 10px 15px; border-radius: 12px; font-weight: bold;
            font-size: 13px; cursor: pointer; text-transform: uppercase;
        }
        .btn-icon { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 10px; cursor: pointer; margin-left: 5px; }
        .fab-add { position: fixed; bottom: 30px; right: 30px; background: #c2e7ff; width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #003355; border: none; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 30px; border-radius: 25px; width: 85%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: white; }
        .btn-back { margin-top: 10px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); padding: 12px 25px; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>PRESETS</h1>

    <div style="width: 100%; max-width: 380px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-launch" style="width: 100%; padding: 15px; background: rgba(194, 231, 255, 0.2); color: white; border: 1px dashed #c2e7ff;" onclick="forzarFechaHoy()">
            Forzar fecha
        </button>
        <button class="btn-launch" style="width: 100%; padding: 15px; background: rgba(194, 231, 255, 0.2); color: white; border: 1px dashed #c2e7ff;" onclick="lanzar('todo')">
            Forzar fecha y hora
        </button>
    </div>

    <div id="lista-presets" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

    <button class="btn-back" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
    <button class="fab-add" onclick="abrirModal()">+</button>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color:#c2e7ff;">NUEVO FORZAJE</h3>
            <input type="hidden" id="editIndex">
            <input type="text" id="nombreF" placeholder="Nombre">
            <input type="text" id="valorF" placeholder="Número o 'fecha'/'todo'">
            <button class="btn-launch" style="width:100%; margin-top:10px;" onclick="guardarPreset()">GUARDAR</button>
            <button class="btn-back" style="border:none; width:100%;" onclick="cerrarModal()">CANCELAR</button>
        </div>
    </div>

    <script>
        let presets = JSON.parse(localStorage.getItem('magicPresets')) || [];

        function renderPresets() {
            const contenedor = document.getElementById('lista-presets');
            contenedor.innerHTML = '';
            presets.forEach((p, index) => {
                contenedor.innerHTML += `
                    <div class="preset-card">
                        <div class="preset-info"><b>${p.nombre}</b><span>${p.valor}</span></div>
                        <div style="display:flex;">
                            <button class="btn-launch" onclick="lanzar('${p.valor}')">USAR</button>
                            <button class="btn-icon" onclick="editarPreset(${index})">✏️</button>
                            <button class="btn-icon" onclick="eliminarPreset(${index})">🗑️</button>
                        </div>
                    </div>`;
            });
        }

        function forzarFechaHoy() {
            const hoy = new Date();
            const d = String(hoy.getDate()).padStart(2, '0');
            const m = String(hoy.getMonth() + 1).padStart(2, '0');
            const y = String(hoy.getFullYear()); // Año completo (2026)
            
            let fecha = d + m + y;
            if (fecha.startsWith('0')) fecha = fecha.substring(1);
            
            localStorage.setItem('activeForce', fecha);
            if(navigator.vibrate) navigator.vibrate([30, 50, 30]);
            window.location.href = 'index.html';
        }

        function lanzar(v) {
            localStorage.setItem('activeForce', v);
            if(navigator.vibrate) navigator.vibrate(40);
            window.location.href = 'index.html';
        }

        function abrirModal(index = -1) {
            if (index > -1) {
                document.getElementById('editIndex').value = index;
                document.getElementById('nombreF').value = presets[index].nombre;
                document.getElementById('valorF').value = presets[index].valor;
                document.getElementById('modalTitle').innerText = "EDITAR FORZAJE";
            } else {
                document.getElementById('editIndex').value = -1;
                document.getElementById('nombreF').value = '';
                document.getElementById('valorF').value = '';
                document.getElementById('modalTitle').innerText = "NUEVO FORZAJE";
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }

        function guardarPreset() {
            const nombre = document.getElementById('nombreF').value;
            const valor = document.getElementById('valorF').value;
            const index = document.getElementById('editIndex').value;
            if (!nombre || !valor) return;
            if (index > -1) presets[index] = { nombre, valor };
            else presets.push({ nombre, valor });
            localStorage.setItem('magicPresets', JSON.stringify(presets));
            cerrarModal(); renderPresets();
        }

        function eliminarPreset(index) {
            if (confirm("¿Eliminar?")) { presets.splice(index, 1); localStorage.setItem('magicPresets', JSON.stringify(presets)); renderPresets(); }
        }

        function editarPreset(index) { abrirModal(index); }
        renderPresets();
    </script>
</body>
</html>
